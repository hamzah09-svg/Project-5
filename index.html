<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="images-sec">
        <aside>
          <img class="img-aside" src="images/side_image1.png" alt="side img" />
          <img class="img-aside" src="images/side_image2.png" alt="side img" />
          <img class="img-aside" src="images/side_image3.png" alt="side img" />
          <img class="img-aside" src="images/side_image4.png" alt="side img" />
          <img class="img-aside" src="images/side_image5.png" alt="side img" />
          <img class="img-aside" src="images/side_image6.png" alt="side img" />
        </aside>
        <section class="image_container">
          <img
            class="centre-img"
            src="images/center_image.png"
            alt="centre img"
          />
        </section>
        <section class="content">
          <div class="content-header">
            <p class="green-color">Sustainable Material</p>
            <h1>Nike Revolution 9</h1>
            <h4>Men's Running Shoes</h4>
          </div>
          <section class="price-section">
            <h2>$120</h2>
            <div>
              <p>Inclusive Of All Taxes</p>
              <p>Also Include All Applicable Duties</p>
            </div>
          </section>
          <section class="varient-section">
            <img src="images/variant1.png" alt="varient 1" />
            <img src="images/variant2.png" alt="varient 2" />
            <img src="images/variant3.png" alt="varient 3" />
            <img src="images/variant4.png" alt="varient 4" />
          </section>
          <section class="size-section">
            <div class="size-header">
              <h4>Select Size</h4>
              <h4>Size Guide</h4>
            </div>
            <section class="sizes">
              <div class="size">UK 6</div>
              <div class="size">UK 7</div>
              <div class="size">UK 8</div>
              <div class="size">UK 9</div>
            </section>
          </section>
          <section class="button-container">
            <button class="add-to-cart">Add To Cart</button>
            <button class="wishlist">Wishlist</button>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
